name: 嗅你狠
options:
  bundleIdPrefix: com.odorwatch
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  SWIFT_VERSION: "5.9"

targets:
  OdorWatch:
    type: application
    platform: macOS
    sources:
      - Sources/OdorWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.odorwatch.app
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO

  OdorWatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/OdorWatchTests
    dependencies:
      - target: OdorWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.odorwatch.tests
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: NO

schemes:
  OdorWatch:
    build:
      targets:
        OdorWatch: all
    test:
      targets:
        - OdorWatchTests
    run:
      config: Release
